<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <script src="js/script.js" type="text/javascript"></script>
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="left-container">
        <div class="left-header-overlay">
            <img id="logo" src="images/odin-lined.png" alt="VIVIT Creative Logo">
            <div>
                <h1>V/Creative</h1>
            </div>
        </div>
        <div class="left-bottom">

        </div>
    </div>
    <div class="right-container">
        <div class="form-header">
            <h1>Some information about the form and the title</h1>
        </div>
        <div class="form-body">
            <form action="submit" class="theform">
                <h2>Let's do this!</h2>
                <div>
                    <div>
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" name="first_name">
                    </div>
                    <div>
                        <label for="last_name">LAST NAME</label>
                        <input type="text" name="last_name">
                    </div>
                </div>
                <div>
                    <div>
                        <label for="email">EMAIL</label>
                        <input type=" email" name="email">
                    </div>
                    <div>
                        <label for="phone">PHONE NUMBER</label>
                        <input type="phone" name="phone">
                    </div>
                </div>
                <div>
                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password">
                    </div>
                    <div>
                        <label for="password2">CONFIRM PASSWORD</label>
                        <input type="password" name="password2">
                    </div>


                </div>

            </form>
        </div>

        <div class="form-footer">
            <div>
                <button>Create Account</button>
            </div>
            <div>Already have and account? <a href="#">Log in</a></div>
        </div>
    </div>
</body>

</html>
